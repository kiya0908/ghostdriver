<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0a0e1a"/><text x="80" y="88" fill="#e8f0ff" font-family="Arial" font-size="42" font-weight="700">SONG ID CHECKLIST</text><text x="80" y="130" fill="#a8b4cc" font-family="Arial" font-size="22">A working Roblox audio asset still depends on permissions and moderation</text><g font-family="Arial"><g transform="translate(100 220)"><rect width="1000" height="80" rx="18" fill="#1a2740" stroke="#3a4a72"/><circle cx="45" cy="40" r="20" fill="#22c55e"/><text x="85" y="49" fill="#e8f0ff" font-size="24">Copy the numeric asset ID only</text></g><g transform="translate(100 325)"><rect width="1000" height="80" rx="18" fill="#1a2740" stroke="#3a4a72"/><circle cx="45" cy="40" r="20" fill="#38bdf8"/><text x="85" y="49" fill="#e8f0ff" font-size="24">Paste it into the in-game audio field</text></g><g transform="translate(100 430)"><rect width="1000" height="80" rx="18" fill="#1a2740" stroke="#3a4a72"/><circle cx="45" cy="40" r="20" fill="#f0b030"/><text x="85" y="49" fill="#e8f0ff" font-size="24">Test playback and remove unavailable assets</text></g></g></svg>