<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0a0e1a"/><text x="80" y="88" fill="#e8f0ff" font-family="Arial" font-size="42" font-weight="700">TUNING BASELINE METHOD</text><text x="80" y="130" fill="#a8b4cc" font-family="Arial" font-size="22">Change one variable, run the same test, keep only measurable gains</text><g font-family="Arial"><g transform="translate(90 210)"><rect width="300" height="310" rx="24" fill="#1a2740" stroke="#3a4a72"/><text x="30" y="58" fill="#ff3b4a" font-size="24" font-weight="700">BASELINE</text><text x="30" y="110" fill="#e8f0ff" font-size="22">Stock setup</text><text x="30" y="155" fill="#a8b4cc" font-size="19">• same route</text><text x="30" y="195" fill="#a8b4cc" font-size="19">• same camera</text><text x="30" y="235" fill="#a8b4cc" font-size="19">• same pace</text></g><g transform="translate(450 210)"><rect width="300" height="310" rx="24" fill="#1a2740" stroke="#38bdf8"/><text x="30" y="58" fill="#38bdf8" font-size="24" font-weight="700">ONE CHANGE</text><text x="30" y="110" fill="#e8f0ff" font-size="22">Adjust one setting</text><text x="30" y="155" fill="#a8b4cc" font-size="19">Avoid stacking edits</text><text x="30" y="195" fill="#a8b4cc" font-size="19">before testing.</text></g><g transform="translate(810 210)"><rect width="300" height="310" rx="24" fill="#1a2740" stroke="#22c55e"/><text x="30" y="58" fill="#22c55e" font-size="24" font-weight="700">RETEST</text><text x="30" y="110" fill="#e8f0ff" font-size="22">Compare behavior</text><text x="30" y="155" fill="#a8b4cc" font-size="19">Keep the change only</text><text x="30" y="195" fill="#a8b4cc" font-size="19">when it solves the</text><text x="30" y="235" fill="#a8b4cc" font-size="19">problem you measured.</text></g></g></svg>