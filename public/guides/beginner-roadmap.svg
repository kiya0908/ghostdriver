<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Ghost Driver beginner roadmap</title><desc id="d">A four-stage roadmap from controls to clean traffic runs.</desc><rect width="1200" height="675" fill="#0a0e1a"/><path d="M80 338h1040" stroke="#3a4a72" stroke-width="8" stroke-dasharray="28 22"/><g font-family="Arial,sans-serif" fill="#e8f0ff"><text x="80" y="86" font-size="42" font-weight="700">BEGINNER ROADMAP</text><text x="80" y="130" fill="#a8b4cc" font-size="22">Learn the car before chasing speed</text></g><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(180 338)"><circle r="70" fill="#1a2740" stroke="#ff3b4a" stroke-width="5"/><text y="-5" fill="#fff" font-size="30" font-weight="700">01</text><text y="110" fill="#e8f0ff" font-size="22">CONTROLS</text></g><g transform="translate(460 338)"><circle r="70" fill="#1a2740" stroke="#38bdf8" stroke-width="5"/><text y="-5" fill="#fff" font-size="30" font-weight="700">02</text><text y="110" fill="#e8f0ff" font-size="22">CAMERA</text></g><g transform="translate(740 338)"><circle r="70" fill="#1a2740" stroke="#f0b030" stroke-width="5"/><text y="-5" fill="#fff" font-size="30" font-weight="700">03</text><text y="110" fill="#e8f0ff" font-size="22">TRAFFIC</text></g><g transform="translate(1020 338)"><circle r="70" fill="#1a2740" stroke="#22c55e" stroke-width="5"/><text y="-5" fill="#fff" font-size="30" font-weight="700">04</text><text y="110" fill="#e8f0ff" font-size="22">CONSISTENCY</text></g></g></svg>